[package]
name = "cromite-updater"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Verified, atomic updater for Cromite Portable."
publish = false

[[bin]]
name = "Cromite-Updater"
path = "src/main.rs"

[dependencies]
# Same eframe build as Nomad: glow renderer + AccessKit, no bundled fonts.
eframe = { version = "0.31", default-features = false, features = ["accesskit", "glow"] }
hex = "0.4"
ico = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Same posture as Nomad: integer wraparound is a loud panic, not a latent bug.
overflow-checks = true
lto = true
codegen-units = 1
strip = true
