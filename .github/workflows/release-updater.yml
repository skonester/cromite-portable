name: Release updater

# Builds Cromite-Updater.exe from source on every `updater-v*` tag and
# publishes it to a GitHub release with build provenance attestation, so users
# can check the exe came from this repository's code (adapted from Nomad
# Launcher's release workflow).
#
# The tag prefix is deliberately not `v*`: this repository carries upstream
# uazo/cromite tags (`v153.0…`), and those must never trigger a release.
#
# To release: bump `version` in updater/Cargo.toml, commit, then
#   git tag updater-v0.1.0 && git push origin updater-v0.1.0

on:
  push:
    tags: ["updater-v*"]

# Default-deny: the job opts into exactly the permissions it needs below.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, attest, release
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token for Sigstore signing of the attestation
      attestations: write # persist the provenance attestation
    defaults:
      run:
        shell: pwsh
        working-directory: updater
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($env:TAG -ne "updater-v$version") {
            Write-Error "Tag $env:TAG does not match updater/Cargo.toml version $version (expected updater-v$version)"
            exit 1
          }

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # No cargo cache on purpose (as in Nomad): a poisoned cache entry
      # restored into a release build could end up inside the shipped exe.
      - name: Build
        run: cargo build --release --locked

      - name: Stage release assets
        run: |
          $out = New-Item -ItemType Directory -Force dist
          Copy-Item target\release\Cromite-Updater.exe $out
          $hash = (Get-FileHash $out\Cromite-Updater.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Cromite-Updater.exe" | Set-Content -Encoding ascii -NoNewline $out\SHA256SUMS
          Compress-Archive -Force -DestinationPath $out\licenses.zip -Path `
            THIRD_PARTY_NOTICES.md, assets\OFL.txt, ..\LICENSE

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            updater/dist/Cromite-Updater.exe
            updater/dist/SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $notes = @"
          Cromite Portable updater, built from ``$env:TAG`` by GitHub Actions.

          Put ``Cromite-Updater.exe`` next to ``Cromite Portable.exe`` and run it. It checks uazo/cromite for a new Windows build, verifies its SHA-256 digest, installs it into ``app\``, and launches Cromite.

          Verify this download:
          ``gh attestation verify Cromite-Updater.exe --repo $env:REPO``
          "@
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            # --latest=false: the repository's "latest" release stays the
            # portable browser bundle, not the updater.
            gh release create $env:TAG --repo $env:REPO --verify-tag --latest=false `
              --title "Cromite Portable Updater $($env:TAG -replace '^updater-', '')" --notes $notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG --repo $env:REPO --clobber `
            dist\Cromite-Updater.exe dist\SHA256SUMS dist\licenses.zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
