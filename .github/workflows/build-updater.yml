name: Build updater

# Run from the Actions tab: "Build updater" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: updater
        run: cargo build --release

      - name: Upload to releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' updater/Cargo.toml | cut -d'"' -f2)
          TAG="updater-v$VERSION-build${{ github.run_number }}"
          gh release create "$TAG" updater/target/release/Cromite-Updater.exe \
            --target "${{ github.sha }}" \
            --title "Cromite Updater $VERSION (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}"
